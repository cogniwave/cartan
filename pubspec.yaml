name: cartan
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0
homepage: https://cartan.pt
repository: https://github.com/cogniwave/cartan
issue_tracker: https://github.com/cogniwave/cartan/issues
platforms:
  ios:
  android:
topics:
  - flutter
  - ios
  - android
  - mobile

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_dotenv: ^5.2.1
  intl: ^0.19.0
  antdesign_icons: ^0.0.3
  bugsnag_flutter: ^4.1.2
  package_info_plus: ^8.3.0
  provider: ^6.0.5
  shared_preferences: ^2.2.0
  url_launcher: ^6.3.1
  uuid: ^4.5.1
  mobile_scanner: ^6.0.10
  barcode_widget: ^2.0.3
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.2
  map_launcher: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - lib/assets/data/merchants.json
    - lib/assets/images/loyalty_cards/